#:schema ../schema.json

[machine]
computer_name = "Wills-MacBook-Pro"
type          = "apple-silicon"
username      = "will"

[user]
name   = "Will Corrigan"
email  = "will-corrigan@users.noreply.github.com"
ssh_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFgiyIYwcXW7FTDzIXcviy0JEugrzGHk4R8KoFvmazy3"

[appearance]
font      = "monaspace-neon"
theme     = "catppuccin-mocha"
wallpaper = "default"

[programs]
zsh      = "curated"
starship = "curated"
fzf      = "curated"
bat      = "curated"
btop     = "curated"
ghostty  = "curated"
zed      = "curated"
tmux     = "curated"
git      = "curated"
direnv   = "curated"
zoxide   = "curated"
mise     = "curated"

[integrations]
ssh_signing = "1password"

[extra_packages]
cli   = ["_1password-cli", "bruno", "eza", "fd", "flyctl", "glow", "jq", "k9s", "kubectl", "deadnix", "nixd", "nh", "nixfmt", "statix", "p7zip", "ripgrep", "sqlite", "terraform-ls", "tldr", "tree", "vim", "wget", "yq"]
brews = ["awscli", "mise"]
casks = ["1password", "claude-code@latest", "discord", "ghostty", "google-chrome", "gcloud-cli", "rancher", "raycast", "slack", "spotify", "stats", "visual-studio-code", "zed"]

[macos.keyboard]
caps_lock    = "escape"
key_repeat   = "fast"
repeat_delay = "short"
layout       = "british-pc"

[macos.dock]
position        = "bottom"
icon_size       = "medium"
auto_hide       = true
minimize_to_app = true
clear_others    = true
apps = [
  "/System/Applications/System Settings.app",
  "/Applications/Zen.app",
  "/Applications/1Password.app",
  "/Applications/Visual Studio Code.app",
  "/Applications/Slack.app",
  "/Applications/Discord.app",
  "/Applications/Spotify.app",
  "/Applications/Ghostty.app",
  "/Applications/Zed.app",
]

[macos.finder]
default_view    = "list"
show_extensions = true
show_path_bar   = false
show_hidden     = true

[macos.trackpad]
tap_to_click   = true
natural_scroll = false

[macos.text_replacements]
"@@" = "will@contextfab.ai"
